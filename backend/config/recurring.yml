# Recurring tasks for Solid Queue
# Documentation: https://github.com/basecamp/solid_queue

default:
  weekly_reports:
    class: WeeklyReportJob
    # Every Monday at 8 AM
    schedule: "0 8 * * 1"
  expiring_holds:
    class: ExpiringHoldsJob
    # Every 15 minutes: alert on holds close to lapsing, void the ones about to
    schedule: "*/15 * * * *"
